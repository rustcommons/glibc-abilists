# Both workspace members are std-only today. This gate also covers future deps.
[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# Check every dependency for unmaintained/unsound advisories; no exceptions.
unmaintained = "all"
unsound = "all"

[licenses]
# Match the library and unpublished collector; no broader third-party allowlist.
allow = ["LGPL-2.1-or-later", "MIT"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
