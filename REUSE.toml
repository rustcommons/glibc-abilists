version = 1

[[annotations]]
path = ["data/**", "src/**", "Cargo.toml", "README.md", "NOTICE.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Free Software Foundation, Inc. and the GNU C Library contributors; rustcommons contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = ["fuzz/**", ".clusterfuzzlite/**", "collector/**", "upstream.toml", ".github/**", "CLAUDE.md", "AGENTS.md", "docs/**", ".gitattributes", ".gitignore", "Cargo.lock", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "rustcommons contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["keys/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The respective key holders listed in keys/keys.tsv"
SPDX-License-Identifier = "LicenseRef-public-key"

[[annotations]]
path = ["fuzz/corpus/hash_padding/glibc-*.abilist"]
precedence = "override"
SPDX-FileCopyrightText = "Free Software Foundation, Inc. and the GNU C Library contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = ["scripts/release_signing.py", "scripts/test_release_signing.py", "scripts/github_release.py", "scripts/test_github_release.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "rustcommons contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".github/release-signing-key.asc"]
precedence = "override"
SPDX-FileCopyrightText = "The release signing key holder"
SPDX-License-Identifier = "LicenseRef-public-key"
