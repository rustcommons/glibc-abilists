[package]
name = "glibc-abilists"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "The GNU C Library's own ABI lists (x86_64, glibc 2.17-2.44), collected from glibc's signed release tags with full provenance"
repository = "https://github.com/rustcommons/glibc-abilists"
license = "LGPL-2.1-or-later"
readme = "README.md"
keywords = ["glibc", "abi", "symbols", "linux", "compatibility"]
categories = ["development-tools::build-utils"]
include = [
    "src/**",
    "data/**",
    "Cargo.toml",
    "README.md",
    "NOTICE.md",
    "LICENSES/LGPL-2.1-or-later.txt",
]

[dependencies]

# The collector is MIT licensed and never published; see CLAUDE.md.
[workspace]
members = ["collector"]
resolver = "2"
