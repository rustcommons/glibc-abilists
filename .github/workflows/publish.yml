name: Publish crate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Only this job can request a short-lived crates.io token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.90.0
      - name: Require a version-matching tag on reviewed main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYCODE'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag does not match the library manifest version')
          PYCODE
          python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY"
      - run: cargo test --workspace --locked --offline
      - run: cargo package --locked -p glibc-abilists
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # The collector is publish=false; only the library is published.
      - run: cargo publish --locked -p glibc-abilists
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Verify official archive and registry checksum against the local package
        run: python3 scripts/verify-crate-checksum.py
