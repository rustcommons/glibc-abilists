name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: detect upstream tag or mirror changes affecting published data.
    - cron: "17 5 * * 1"
# Superseded PR revisions cancel; non-PR runs retain independent qualification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        # Dependabot keeps one Linux fmt/test/clippy job; normal PRs keep both OSes.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain using runner-provided rustup
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0
          rustc --version
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain using runner-provided rustup
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
      # Broken intra-doc links and malformed docs fail the build.
      - run: cargo doc --workspace --no-deps --locked --offline
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain using runner-provided rustup
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustc --version
      - run: cargo test --workspace --locked --offline
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain using runner-provided rustup
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
      - run: cargo package --locked
      - run: cargo package --list --locked | grep -v '^data/' ; cargo package --list --locked | grep -c '^data/'
  upstream:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    name: Data matches glibc's signed tags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain using runner-provided rustup
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
      - run: git clone --quiet --bare --filter=blob:none https://sourceware.org/git/glibc.git "$RUNNER_TEMP/glibc.git"
      - run: cargo run --release --locked -p glibc-abilists-collector -- --glibc "$RUNNER_TEMP/glibc.git" --check
