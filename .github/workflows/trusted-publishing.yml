name: Publish crate
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/trusted-publishing.yml'
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dry-run:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and report the release toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustc --version
      - run: python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY"
      - name: Validate the release package without credentials or upload
        run: cargo publish --dry-run --locked -p glibc-abilists
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Only this job can request a short-lived crates.io token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain using runner-provided rustup
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustc --version
      - name: Require a version-matching tag on reviewed main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYCODE'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Tag does not match the library manifest version')
          PYCODE
          python3 scripts/check-release-docs.py --repo "$GITHUB_REPOSITORY"
      - run: cargo test --workspace --locked --offline
      - run: cargo package --locked -p glibc-abilists
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # The collector is publish=false; only the library is published.
      - run: cargo publish --locked -p glibc-abilists
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Verify official archive and registry checksum against the local package
        run: python3 scripts/verify-crate-checksum.py
