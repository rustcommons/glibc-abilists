name: Security gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
# Superseded PR revisions cancel; non-PR runs retain independent qualification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
      - run: python -m pip install --require-hashes -r .github/requirements-security.txt
      - run: zizmor --offline .
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain using runner-provided rustup
        shell: bash
        run: |
          set -euo pipefail
          rustup set auto-self-update disable
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - run: cargo install cargo-deny --locked --version 0.20.2 --jobs 2
      # Promote unmaintained advisory warnings to errors; duplicate versions warn.
      - run: cargo deny --workspace --locked check --deny unmaintained
